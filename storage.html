<link rel="icon" type="image/png" href="assets/img/favicon.png">

<body>

<header data-tab="storage.html"></header>

<div id="glMain">
  <div class="pan" style="flex:1">
    <div class="ph"><i class="fa-solid fa-box-archive"></i>저장한 모델</div>
    <div class="pb">
      <div id="stEmpty" class="hint" style="margin-top:0;display:none">
        <img src="assets/img/pibo-idea.png" alt="" style="width:110px;display:block;margin:18px auto 10px">
        <div style="text-align:center;font-size:12.5px">
          아직 저장한 모델이 없어요.<br><a href="index.html" style="color:var(--acc-ink)">학습실</a>에서 만들어 보세요.
        </div>
      </div>
      <div style="overflow-x:auto">
        <table id="stTable" style="display:none">
          <thead>
            <tr><th>이름</th><th>무엇을 보나</th><th>종류</th><th>예시</th><th>맞힌 비율</th><th>만든 날</th><th></th></tr>
          </thead>
          <tbody id="stBody"></tbody>
        </table>
      </div>

      <div class="dropzone" id="dropZone">
        내보낸 zip 파일을 여기에 놓으면 다시 들어와요. (눌러서 고르기)
      </div>
      <input type="file" id="impFile" accept=".zip" style="display:none">
    </div>
  </div>
</div>

<div id="toast"></div>
